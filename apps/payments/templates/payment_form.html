<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- First Division -->
    <header class="flex justify-between items-center bg-gray-800 text-white p-4">
        <div class="text-2xl font-bold">VK Collections</div>
        <div class="flex items-center space-x-4">
            <!-- <div class="flex items-center space-x-2 border-2 border-white px-3 py-1 rounded-lg relative group"> -->
                <a href="{% url 'cart' %}" class="flex">
                    <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.2 5.8A2 2 0 008 21h8a2 2 0 001.8-2.2L17 13M5.4 5H21M16 16v2M8 16v2" />
                    </svg><p class="text-white">&nbsp;Cart</p>
                    <span class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold rounded-full px-1">
                        {{ cart.items.count }}
                    </span>
                </a>
            <!-- </div> -->
            <div class="flex items-center space-x-2 border-2 border-white px-3 py-1 rounded-lg relative group">
                <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A10.94 10.94 0 0112 16c2.985 0 5.735 1.165 7.879 3.034M12 14a4 4 0 100-8 4 4 0 000 8z" />
                </svg>
                <p class="text-white">{{ user.get_username }}</p>
                <!-- Dropdown with Tailwind -->
                <div class="relative">
                    <!-- Profile Icon and Dropdown Toggle -->
                    <button class="flex items-center space-x-2 p-0 text-white" aria-expanded="false" onclick="toggleDropdown()">
                        <i class="bi bi-person-circle text-xl"></i>
                        <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>

                    <!-- Dropdown Menu -->
                    <ul id="profileDropdown" class="absolute right-0 hidden mt-2 space-y-2 bg-white text-black rounded-lg shadow-lg w-40 z-10">
                        <li>
                            <a href="#" class="block px-4 py-2 text-sm hover:font-semibold">
                                <i class="bi bi-cart-fill me-1"></i> Orders
                            </a>
                        </li>
                        <li>
                            <form action="{% url 'logout' %}" method="post" class="dropdown-item">
                                {% csrf_token %}
                                <button type="submit" class="block px-4 py-2 text-sm text-red-500 hover:font-semibold">
                                    <i class="bi bi-cart-fill me-1 "></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <!-- Navigation Bar -->
    <nav class="bg-gray-200 p-4">
        <ul class="flex space-x-4">
            <li><a href="{% url 'dashboard' %}" class="text-blue-500 hover:underline">Home</a></li>
            <li><a href="#" class="text-blue-500 hover:underline">Electronics</a></li>
            <li><a href="#" class="text-blue-500 hover:underline">Fashion</a></li>
            <li><a href="#" class="text-blue-500 hover:underline">Books</a></li>
            <li><a href="#" class="text-blue-500 hover:underline">Contact Us</a></li>
        </ul>
    </nav>
    <h1>Payment for Order #{{ order.id }}</h1>
    <p>Order Details:</p>
    <p>Amount: Rs.{{ order.total_amount }}</p>
    <!-- Razorpay Payment Button -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options = {
            key: 'rzp_test_yvz7nqyO5zzJxm', // Your Razorpay Key ID
            key_secret: "HmlhZnif01JECmZBqMxQFS8e",
            amount: "{{amount}}", // Amount in paise
            currency: "INR",
            name: "VK Collections",
            description: "Order  #{{ order.id }} Payment",
            image: "VK", // Optional logo
            order_id: "{{ razorpay_order_id }}",
            handler: function (response){
                alert("Payment successful: " + response.razorpay_payment_id);
                // Add your success logic here, like updating the order status
            },
            prefill: {
                name: "Karthikrajan",
                email: "karthikrajan2k@gmail.com",
                contact: "8344488604"
            },
            theme: {
                color: "#F37254"
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
    </script>
</body>
</html>
